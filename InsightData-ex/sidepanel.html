<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsightData</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>InsightData</h2>
        </div>

        <div class="actions">
            <button id="summarizeBtn">📝 Summarize</button>
            <button id="suggestBtn">💡 Suggest Topics</button>
        </div>

        <div id="results">
            <p class="placeholder">Select text on any page, then click a button above.</p>
        </div>

        <div class="notes">
            <h3>Research Notes</h3>
            <textarea id="notes" placeholder="Take notes here..."></textarea>
            <button id="saveNotesBtn">💾 Save Notes</button>
        </div>
    </div>
    <script src="sidepanel.js"></script>
</body>
</html>
